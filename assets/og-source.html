<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>OG — Максим Вагин</title>
<style>
@font-face{font-family:Oranienbaum;src:url('fonts/oranienbaum-400-cyrillic.woff2') format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:Oranienbaum;src:url('fonts/oranienbaum-400-latin.woff2') format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:JetBrains;src:url('fonts/jetbrains-mono-400-cyrillic.woff2') format('woff2');font-weight:400;font-style:normal}
@font-face{font-family:JetBrains;src:url('fonts/jetbrains-mono-400-latin.woff2') format('woff2');font-weight:400;font-style:normal}
*{box-sizing:border-box}
html,body{width:1200px;height:630px;margin:0;overflow:hidden}
body{background:#f4f1ea;color:#16150f}
.card{position:relative;width:1200px;height:630px;padding:62px 72px 48px}
.top{display:flex;align-items:center;justify-content:space-between;height:57px;border-bottom:1px solid #cbc4b2}
.eyebrow,.facts{font-family:JetBrains,monospace;text-transform:uppercase;letter-spacing:.19em}
.eyebrow{font-size:16px;line-height:1;color:#403d34}
.mark{display:grid;place-items:center;width:44px;height:44px;background:#16150f;color:#f4f1ea;font-family:Oranienbaum,serif;font-size:29px;line-height:1}
.mark span{color:#a32235}
h1{margin:45px 0 0;font-family:Oranienbaum,serif;font-size:78px;font-weight:400;line-height:.99;letter-spacing:-.012em}
h1 em{color:#9e2033;font-style:italic}
.bottom{position:absolute;left:72px;right:72px;bottom:48px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid #cbc4b2;padding-top:26px}
.facts{display:flex;gap:41px;font-size:15px;line-height:1;letter-spacing:.14em}
.facts b{font-weight:400;color:#9e2033}
.person{text-align:right}
.name{font-family:Oranienbaum,serif;font-size:38px;line-height:1}
.tg{margin-top:12px;font-family:JetBrains,monospace;font-size:13px;line-height:1;letter-spacing:.13em;text-transform:uppercase;color:#736d5e}
</style>
</head>
<body>
  <main class="card">
    <header class="top">
      <div class="eyebrow">Тюмень · сайты для бизнеса</div>
      <div class="mark" aria-hidden="true">В<span>·</span></div>
    </header>

    <h1>Сайты,<br>на которые приходят<br><em>заявки</em></h1>

    <footer class="bottom">
      <div class="facts">
        <span><b>от</b> 14 999 ₽</span>
        <span>5–14 дней</span>
        <span>без конструкторов</span>
      </div>
      <div class="person">
        <div class="name">Максим Вагин</div>
        <div class="tg">@skysx0207</div>
      </div>
    </footer>
  </main>
</body>
</html>
